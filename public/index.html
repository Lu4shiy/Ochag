<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер будущего</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Окно авторизации / регистрации -->
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <h2>Вход в мессенджер</h2>
            <form id="auth-form">
                <input type="text" id="username" placeholder="Имя пользователя" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <div class="auth-buttons">
                    <button type="submit" id="login-btn">Войти</button>
                    <button type="button" id="register-btn">Зарегистрироваться</button>
                </div>
                <p id="auth-error" class="error"></p>
            </form>
        </div>
    </div>

    <!-- Основной интерфейс мессенджера -->
    <div id="app-screen" class="screen hidden">
        <div class="sidebar">
            <div class="user-profile-container">
                <div class="user-profile" id="user-profile-btn">
                    <div class="user-info">
                        <div class="user-avatar" id="my-avatar">U</div>
                        <span id="current-username">User</span>
                    </div>
                    <span class="dropdown-arrow">▾</span>
                </div>
                
                <div id="user-dropdown" class="dropdown-menu hidden">
                    <div class="dropdown-item" id="menu-profile">👤 Профиль</div>
                    <div class="dropdown-item" id="menu-create">➕ Создать</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item logout" id="menu-logout">🚪 Выйти</div>
                </div>
            </div>
            
            <div class="nav-sections">
                <div id="chats-list" class="chats-list-container"></div>
            </div>

            <div class="customization-slot">
                <span>🎨 Слот кастомизации</span>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div id="active-chat-header-info" class="chat-header-info clickable-header" title="Посмотреть профиль">
                    <div class="chat-header-avatar" id="active-avatar">#</div>
                    <div class="chat-header-text">
                        <h3 id="active-chat-title">Выберите чат</h3>
                        <span id="active-chat-status" class="chat-status hidden"></span>
                    </div>
                </div>
            </div>
            <div id="messages-container" class="messages-container"></div>
            <form id="message-form" class="message-form hidden">
                <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off" required>
                <button type="submit" class="send-btn" title="Отправить">➤</button>
            </form>
        </div>
    </div>

    <!-- Уведомление -->
    <div id="app-toast" class="toast hidden">
        <span id="toast-text"></span>
    </div>

    <!-- Модальное окно редактирования профиля -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Редактирование профиля</h3>
            <form id="profile-form">
                <div class="profile-avatar-section">
                    <div class="current-profile-avatar" id="profile-preview-avatar">U</div>
                    <div class="profile-avatar-controls">
                        <label class="file-upload-btn">
                            📂 Загрузить свою
                            <input type="file" id="custom-avatar-input" accept="image/*" hidden>
                        </label>
                    </div>
                </div>
                <div class="preset-avatars-label">Или выберите иконку:</div>
                <div class="preset-avatars-grid" id="preset-avatars">
                    <div class="preset-item" data-val="🦁">🦁</div>
                    <div class="preset-item" data-val="🦊">🦊</div>
                    <div class="preset-item" data-val="🐼">🐼</div>
                    <div class="preset-item" data-val="🐨">🐨</div>
                    <div class="preset-item" data-val="🐰">🐰</div>
                    <div class="preset-item" data-val="🐱">🐱</div>
                    <div class="preset-item" data-val="🐶">🐶</div>
                    <div class="preset-item" data-val="🚀">🚀</div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label class="modal-label">Никнейм</label>
                    <input type="text" id="profile-username-input" required>
                </div>

                <div class="input-group">
                    <label class="modal-label">Дата рождения</label>
                    <div class="dob-selectors">
                        <select id="dob-day">
                            <option value="">День</option>
                        </select>
                        <select id="dob-month">
                            <option value="">Месяц</option>
                            <option value="1">Январь</option>
                            <option value="2">Февраль</option>
                            <option value="3">Март</option>
                            <option value="4">Апрель</option>
                            <option value="5">Май</option>
                            <option value="6">Июнь</option>
                            <option value="7">Июль</option>
                            <option value="8">Август</option>
                            <option value="9">Сентябрь</option>
                            <option value="10">Октябрь</option>
                            <option value="11">Ноябрь</option>
                            <option value="12">Декабрь</option>
                        </select>
                        <select id="dob-year">
                            <option value="">Год (необязательно)</option>
                        </select>
                    </div>
                </div>

                <p id="profile-error" class="error" style="display: none;"></p>

                <div class="modal-buttons" style="margin-top: 10px;">
                    <button type="submit">Сохранить</button>
                    <button type="button" id="close-profile-modal-btn">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно просмотра профиля собеседника -->
    <div id="user-info-modal" class="modal hidden">
        <div class="modal-content text-center">
            <div class="view-profile-avatar" id="view-user-avatar">U</div>
            <h3 id="view-user-name" style="margin-top: 10px;">Имя</h3>
            <div class="view-profile-details">
                <p><strong>Дата регистрации:</strong> <span id="view-user-created">-</span></p>
                <p><strong>Дата рождения:</strong> <span id="view-user-birth">-</span></p>
            </div>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button type="button" id="close-user-info-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания пространства -->
    <div id="create-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Создать личный чат</h3>
            <form id="create-chat-form">
                <div class="input-group">
                    <label id="modal-label" class="modal-label">Имя пользователя собеседника</label>
                    <input type="text" id="new-chat-name" placeholder="Введите имя..." required>
                </div>

                <div class="type-selector">
                    <button type="button" class="type-btn active" data-type="dm">Личный чат</button>
                    <button type="button" class="type-btn" data-type="channel">Канал</button>
                    <button type="button" class="type-btn" data-type="community">Сообщество</button>
                </div>
                <input type="hidden" id="new-chat-type" value="dm">

                <p id="modal-error" class="error" style="display: none; margin-top: 5px;"></p>

                <div class="modal-buttons">
                    <button type="submit">Создать</button>
                    <button type="button" id="close-modal-btn">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
