<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер будущего (Шаг 2)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Окно авторизации / регистрации -->
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <h2>Вход в мессенджер</h2>
            <form id="auth-form">
                <input type="text" id="username" placeholder="Имя пользователя" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <div class="auth-buttons">
                    <button type="submit" id="login-btn">Войти</button>
                    <button type="button" id="register-btn">Зарегистрироваться</button>
                </div>
                <p id="auth-error" class="error"></p>
            </form>
        </div>
    </div>

    <!-- Основной интерфейс мессенджера -->
    <div id="app-screen" class="screen hidden">
        <div class="sidebar">
            <div class="user-profile">
                <span id="current-username">User</span>
                <button id="logout-btn">Выйти</button>
            </div>
            
            <div class="nav-sections">
                <div class="section-group">
                    <h3>💬 Личные чаты</h3>
                    <div id="dm-list" class="chat-category-list"></div>
                </div>
                <div class="section-group">
                    <h3>📢 Каналы</h3>
                    <div id="channel-list" class="chat-category-list"></div>
                </div>
                <div class="section-group">
                    <h3>🌐 Сообщества</h3>
                    <div id="community-list" class="chat-category-list"></div>
                </div>
            </div>

            <div class="create-chat-panel">
                <button id="open-create-modal-btn">+ Создать пространство</button>
            </div>

            <div class="customization-slot">
                <span>🎨 Слот кастомизации</span>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h3 id="active-chat-title">Выберите чат</h3>
            </div>
            <div id="messages-container" class="messages-container"></div>
            <form id="message-form" class="message-form hidden">
                <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off" required>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно создания пространства -->
    <div id="create-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Создать новое пространство</h3>
            <form id="create-chat-form">
                <input type="text" id="new-chat-name" placeholder="Название..." required>
                <select id="new-chat-type">
                    <option value="dm">Личный чат (DM)</option>
                    <option value="channel">Канал</option>
                    <option value="community">Сообщество</option>
                </select>
                <div class="modal-buttons">
                    <button type="submit">Создать</button>
                    <button type="button" id="close-modal-btn">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
